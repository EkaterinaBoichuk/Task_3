base.url=https://qa-stellarburgers.education-services.ru/
api.url=https://qa-stellarburgers.education-services.ru/api

# path to the Yandex Browser executable, used only when -Dbrowser=yandex
yandex.browser.path=/Applications/Yandex.app/Contents/MacOS/Yandex

# Yandex Browser's own "About" version (e.g. 26.3) does NOT match its underlying
# Chromium engine version, which is what chromedriver needs to match.
# Find the real value by opening yandexbrowser://version (or chrome://version)
# in Yandex Browser and reading the Chromium build number.
yandex.chromium.version=144
